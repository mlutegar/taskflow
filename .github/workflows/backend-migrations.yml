name: Backend Migration Drift Check

on:
  push:
    branches: [main]
    paths:
      - "backend/prisma/**"
      - "backend/package.json"
  pull_request:
    paths:
      - "backend/prisma/**"
      - "backend/package.json"
  workflow_dispatch:

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Falha se o schema.prisma tiver mudanças que ainda não foram
      # capturadas por uma migration (a causa raiz do erro `updated_at
      # does not exist`). Não precisa de banco vivo.
      - name: Check schema vs migrations drift
        working-directory: backend
        run: npm run db:drift-check
