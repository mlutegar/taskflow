name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Type-check informativo (não bloqueia: há erros de tipagem herdados).
      # O gate contra bugs de Hooks (React #310) é a regra rules-of-hooks no lint.
      - name: Type-check (non-blocking)
        run: npm run typecheck
        continue-on-error: true

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build
        env:
          APP_COMMIT: ${{ github.sha }}
