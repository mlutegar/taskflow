server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the app under /taskflow/
    location /taskflow/ {
        alias /usr/share/nginx/html/taskflow/;
        try_files $uri $uri/ /taskflow/index.html;
    }

    # Redirect root to /taskflow/
    location = / {
        return 301 /taskflow/;
    }

    # Proxy interno para o backend (sem expor pelo Cloudflare)
    location /api/ {
        proxy_pass http://taskflow-api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
}
