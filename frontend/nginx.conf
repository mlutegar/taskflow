server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the app under /taskflow/
    location /taskflow/ {
        alias /usr/share/nginx/html/taskflow/;
        try_files $uri $uri/ /taskflow/index.html;
    }

    # Assets com hash no nome → cache longo e imutável
    location /taskflow/assets/ {
        alias /usr/share/nginx/html/taskflow/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Entrypoints que NÃO têm hash → nunca cachear (evita build antigo grudado)
    location = /taskflow/index.html {
        alias /usr/share/nginx/html/taskflow/index.html;
        add_header Cache-Control "no-cache";
    }
    location = /taskflow/sw.js {
        alias /usr/share/nginx/html/taskflow/sw.js;
        add_header Cache-Control "no-cache";
    }
    location = /taskflow/registerSW.js {
        alias /usr/share/nginx/html/taskflow/registerSW.js;
        add_header Cache-Control "no-cache";
    }

    # Redirect root to /taskflow/
    location = / {
        return 301 /taskflow/;
    }

    # Proxy interno para o backend (sem expor pelo Cloudflare)
    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://taskflow-api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Streaming SSE (/api/tasks/sync/events): sem buffering para os eventos
        # chegarem em tempo real e sem timeout curto derrubando a conexão longa.
        # O backend já envia `X-Accel-Buffering: no`; isto reforça contra proxies
        # intermediários e mantém Connection limpo para o keep-alive do stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
}
