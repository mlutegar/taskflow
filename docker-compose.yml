services:
  taskflow-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: taskflow-api:latest
    container_name: taskflow-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3033:3001"
    environment:
      DATABASE_URL: file:/data/taskflow.db
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5175}
    volumes:
      - taskflow_data:/data

  litestream:
    image: litestream/litestream:latest
    container_name: taskflow-litestream
    restart: unless-stopped
    volumes:
      - taskflow_data:/data
      - ./litestream.yml:/etc/litestream.yml
    command: replicate
    depends_on:
      - taskflow-api

  taskflow:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    image: taskflow:latest
    container_name: taskflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:3026:80"
    depends_on:
      - taskflow-api

volumes:
  taskflow_data:
    name: taskflow_data
