services:
  taskflow-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: taskflow-api:latest
    container_name: taskflow-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3033:3001"
    environment:
      DATABASE_URL: file:/data/taskflow.db
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5175}
    volumes:
      - taskflow_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  litestream:
    image: litestream/litestream:latest
    container_name: taskflow-litestream
    restart: unless-stopped
    volumes:
      - taskflow_data:/data
      - ./litestream.yml:/etc/litestream.yml
    command: replicate
    depends_on:
      - taskflow-api

  taskflow:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: taskflow:latest
    container_name: taskflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:3026:80"
    depends_on:
      taskflow-api:
        condition: service_healthy

volumes:
  taskflow_data:
    name: taskflow_data
